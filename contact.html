<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <title>Contact</title>
</head>
<body>
    <header>
        <nav id="contact-nav">
            <a id="home" href="./index.html"> <- Home </a>
        </nav>
    </header>
    <section class="contact-section">
        <h1>Contact</h1>
        
        <form class="contact-form" action="#" method="post">
            <div class="form-group">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" required placeholder="Jane Doe">
            </div>

            <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" required placeholder="jane@example.com">
            </div>

            <div class="form-group">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" required placeholder="How can I help?"></textarea>
            </div>
            
            <div class="checkbox-group">
            <input type="checkbox" id="contact-subscribe" name="subscribe">
            <label for="contact-subscribe">Subscribe to occasional site updates</label>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </section>
</body>
</html>
